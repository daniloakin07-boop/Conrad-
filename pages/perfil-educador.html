<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/auth.css">
  <title>CONRAD Virtual School - Perifl</title>
</head>

<body>

    <div class="dashboard">

        <!-- MENU -->
        <aside class="sidebar">

            <div class="logo">
                <img src="img/logo.png">
            </div>

            <nav>

                <a href="#">
                    <i class="fa-solid fa-comments"></i>
                    Chat
                </a>

                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    Perfil
                </a>

                <a href="#">
                    <i class="fa-solid fa-desktop"></i>
                    Avaliações
                </a>

                <a href="#">
                    <i class="fa-solid fa-clipboard"></i>
                    Atividades
                </a>

            </nav>

        </aside>


        <!-- CONTEÚDO -->

        <main class="conteudo">

            <!-- Cabeçalho -->

            <header>

                <h1>Olá, Prof. Jordan!</h1>

                <p>Aqui está o resumo das suas atividades de hoje.</p>

            </header>


            <!-- Cards -->

            <section class="cards">

                <div class="card">Turmas Ativas</div>

                <div class="card">Atividades</div>

                <div class="card">Alunos</div>

                <div class="card">Média</div>

                <div class="card">Ações</div>

            </section>


            <!-- Segunda Linha -->

            <section class="linha">

                <div class="box grande">
                    Minhas Turmas
                </div>

                <div class="box media">
                    Agenda
                </div>

                <div class="box pequena">
                    Média
                </div>

            </section>


            <!-- Terceira Linha -->

            <section class="linha">

                <div class="box grande">
                    Atividades Pendentes
                </div>

                <div class="box grande">
                    Mensagens
                </div>

            </section>

        </main>

    </div>

</body>
