<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conrad | Editar perfil do educador</title>
  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="stylesheet" href="../CSS/professor.css" />
  <style>
    body {
      background: #f5f7fb;
    }

    .perfil-page {
      max-width: 1280px;
      margin: 28px auto;
      padding: 0 20px 40px;
    }

    .perfil-topbar {
      background: #0A1F44;
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .perfil-topbar h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.5px;
    }

    .perfil-topbar .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .perfil-layout {
      display: grid;
      grid-template-columns: 1.5fr 0.95fr;
      gap: 22px;
      background: #fff;
      border: 1px solid #e7ebf2;
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 22px;
    }

    .perfil-card,
    .sala-card {
      background: #fff;
      border: 1px solid #edf1f5;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(16,43,88,0.04);
    }

    .perfil-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid #eef2f7;
    }

    .perfil-foto-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      flex-shrink: 0;
    }

    .perfil-foto {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      object-fit: cover;
      background: linear-gradient(135deg, #163b74, #f5821f);
      border: 3px solid #fff;
      box-shadow: 0 8px 18px rgba(22,59,116,0.15);
      display: block;
    }

    .perfil-foto-btn {
      position: absolute;
      right: -6px;
      bottom: -6px;
      background: #F5821F;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(245,130,31,0.3);
    }

    .perfil-header-info h2 {
      font-size: 26px;
      color: #0A1F44;
      margin-bottom: 6px;
    }

    .perfil-header-info p {
      color: #667085;
      margin-bottom: 10px;
    }

    .status-badge {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: #edf8f0;
      color: #2e7d32;
      font-weight: 700;
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      color: #0A1F44;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #dfe4ea;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      color: #0A1F44;
      background: #fff;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .btn-primario,
    .btn-secundario,
    .btn-link {
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .btn-primario {
      background: #F5821F;
      color: #fff;
    }

    .btn-primario:hover {
      background: #de7110;
    }

    .btn-secundario {
      background: #eff4fb;
      color: #0A1F44;
      border: 1px solid #dfe8f4;
    }

    .btn-secundario:hover {
      background: #e8eef9;
    }

    .sala-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: linear-gradient(180deg, #f7faff 0%, #ffffff 100%);
    }

    .sala-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #edf1f5;
    }

    .sala-header h3 {
      font-size: 22px;
      color: #0A1F44;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px;
    }

    .sala-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sala-item {
      background: #f7f9fc;
      border: 1px solid #ebeff5;
      border-radius: 12px;
      padding: 14px;
    }

    .sala-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      color: #0A1F44;
    }

    .sala-item span {
      display: block;
      color: #667085;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .sala-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #2f8f52;
      background: #ebf8ef;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .sala-status::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #35b76f;
      border-radius: 50%;
      display: inline-block;
    }

    .hidden-input {
      display: none;
    }

    @media (max-width: 980px) {
      .perfil-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .perfil-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="perfil-page">
    <header class="perfil-topbar">
      <h1>Editar perfil</h1>
      <div class="topbar-actions">
        <a href="educador.html" class="btn-secundario">Voltar ao painel</a>
      </div>
    </header>

    <section class="perfil-layout">
      <div class="perfil-card">
        <div class="perfil-header">
          <div class="perfil-foto-wrap">
            <img id="profilePreview" class="perfil-foto" src="../img/default-professor.jpg" alt="Foto do professor" />
            <button type="button" class="perfil-foto-btn" aria-label="Trocar foto">＋</button>
          </div>

          <div class="perfil-header-info">
            <h2>Rickson Jordan</h2>
            <p>Professor de Matemática e História</p>
            <span class="status-badge">Disponível para aulas</span>
          </div>
        </div>

        <form id="profileForm">
          <div class="form-grid">
            <div class="field">
              <label for="nome">Nome completo</label>
              <input id="nome" type="text" value="Rickson Jordan" />
            </div>

            <div class="field">
              <label for="cargo">Cargo</label>
              <input id="cargo" type="text" value="Professor" />
            </div>

            <div class="field full">
              <label for="email">E-mail</label>
              <input id="email" type="email" value="rickson.jordan@conrad.com" />
            </div>

            <div class="field">
              <label for="telefone">Telefone</label>
              <input id="telefone" type="tel" value="(11) 98888-1234" />
            </div>

            <div class="field">
              <label for="disciplina">Disciplina</label>
              <input id="disciplina" type="text" value="Matemática e História" />
            </div>

            <div class="field full">
              <label for="bio">Sobre o professor</label>
              <textarea id="bio">Professor com foco em metodologias ativas, acompanhamento individualizado e uso de tecnologia em sala de aula.</textarea>
            </div>

            <div class="field">
              <label for="especializacao">Especialização</label>
              <input id="especializacao" type="text" value="Ensino Fundamental II" />
            </div>

            <div class="field">
              <label for="experiencia">Experiência</label>
              <input id="experiencia" type="text" value="8 anos" />
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="btn-secundario">Cancelar</button>
            <button type="submit" class="btn-primario">Salvar perfil</button>
          </div>
        </form>
      </div>

      <aside class="sala-card">
        <div class="sala-header">
          <h3>Sala virtual</h3>
          <a href="#" class="btn-secundario">Entrar</a>
        </div>

        <div class="sala-list">
          <div class="sala-item">
            <strong>3º ano C - Matemática</strong>
            <span>Próxima aula · Hoje às 08:00</span>
            <span class="sala-status">Online</span>
          </div>

          <div class="sala-item">
            <strong>2º ano A - Português</strong>
            <span>Próxima aula · Hoje às 10:00</span>
            <span class="sala-status">Online</span>
          </div>

          <div class="sala-item">
            <strong>1º ano B - História</strong>
            <span>Próxima aula · Hoje às 14:00</span>
            <span class="sala-status">Online</span>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <input id="photoInput" class="hidden-input" type="file" accept="image/*" />

  <script>
    const photoInput = document.getElementById('photoInput');
    const profilePreview = document.getElementById('profilePreview');
    const photoButton = document.querySelector('.perfil-foto-btn');

    photoButton.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        profilePreview.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('profileForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!nome || !email) {
        alert('Nome e e-mail são obrigatórios.');
        return;
      }

      alert('Perfil atualizado com sucesso!');
    });
  </script>
</body>
</html>
