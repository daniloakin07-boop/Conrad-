<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conrad | Nova avaliação</title>
  <link rel="stylesheet" href="../CSS/geral.css" />
  <link rel="stylesheet" href="../CSS/usuarios.css" />
  <link rel="stylesheet" href="../CSS/atividades.css" />
  <link rel="icon" type="image/png" href="../img/Emblema.png">
</head>
<body class="css-formulario">
  <main class="form-page">
    <header class="form-topbar">
      <h1>Nova avaliação</h1>
      <div class="topbar-actions">
        <a href="educador.html" class="btn-secundario">Voltar ao painel</a>
      </div>
    </header>

    <section class="form-layout">
      <div class="form-card">
        <h2>Criar avaliação</h2>

        <form>
          <div class="field-grid">
            <div class="field full">
              <label for="titulo">Nome da avaliação</label>
              <input id="titulo" type="text" placeholder="Ex: Prova de Matemática I" />
            </div>

            <div class="field">
              <label for="turma">Turma</label>
              <select id="turma">
                <option>3º ano C</option>
                <option>2º ano A</option>
                <option>1º ano B</option>
              </select>
            </div>

            <div class="field">
              <label for="disciplina">Disciplina</label>
              <select id="disciplina">
                <option>Matemática</option>
                <option>Português</option>
                <option>História</option>
              </select>
            </div>

            <div class="field">
              <label for="data">Data da aplicação</label>
              <input id="data" type="date" />
            </div>

            <div class="field">
              <label for="valor">Pontuação</label>
              <input id="valor" type="number" min="0.5" step="0.5" value="10" />
            </div>

            <div class="field full">
              <label for="descricao">Objetivos da avaliação</label>
              <textarea id="descricao" placeholder="Descreva os objetivos, conteúdo e critérios da avaliação..."></textarea>
            </div>
          </div>

          <div class="actions">
            <button type="button" class="btn-secundario">Cancelar</button>
            <button type="submit" class="btn-primario">Salvar avaliação</button>
          </div>
        </form>
      </div>

      <aside class="sidebar-card">
        <h3>Checklist</h3>

        <div class="mini-box">
          <strong>Antes de publicar</strong>
          <p>Revise objetivos, grau de dificuldade e prazo de entrega para manter a avaliação alinhada ao conteúdo.</p>
        </div>

        <div class="mini-box">
          <strong>Orientações</strong>
          <ul>
            <li>Defina conteúdo previsto.</li>
            <li>Indique peso da nota.</li>
            <li>Informe data de aplicação.</li>
          </ul>
        </div>
      </aside>
    </section>
  </main>

  <script src="../JS/config.js"></script>
  <script>
    const TIPO = "avaliacao";
    const ROTULO = "avaliação";

    const form = document.querySelector('form');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const dados = {
        titulo: document.getElementById('titulo').value.trim(),
        turma: document.getElementById('turma').value,
        disciplina: document.getElementById('disciplina').value,
        data_aplicacao: document.getElementById('data').value,
        valor_maximo: Number(document.getElementById('valor').value),
        descricao: document.getElementById('descricao').value.trim(),
        tipo: TIPO
      };

      if (!dados.titulo || !dados.data_aplicacao || !dados.descricao) {
        alert('Preencha o nome, a data e a descrição.');
        return;
      }

      if (!dados.valor_maximo || dados.valor_maximo <= 0) {
        alert('Informe um valor/pontuação maior que zero.');
        return;
      }

      const botao = form.querySelector('[type="submit"]');
      botao.disabled = true;

      try {
        await conradFetch('/api/atividades', {
          method: 'POST',
          body: JSON.stringify(dados)
        });
        alert('Sua ' + ROTULO + ' foi publicada e já aparece para os alunos da turma!');
        form.reset();
        document.getElementById('valor').value = 10;
      } catch (erro) {
        alert(erro.message);
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
