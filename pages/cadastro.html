<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/auth.css">
  <title>CONRAD Virtual School - Cadastro</title>
</head>
<body>

  <header class="topo">
    <nav class="menu">
      <a href="../index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="fale-conosco.html">Contato</a>
    </nav>
  </header>

  <main class="container pagina-auth">
    <section class="bloco-auth">
      <h1>Cadastro</h1>
      <p class="texto-auth">Crie sua conta para acessar a plataforma</p>

      <form class="form-auth" id="formCadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <label for="confirmasenha">Confirma senha</label>
        <input type="password" id="confirmasenha" placeholder="Digite sua senha novamente" required>

        <label>Tipo de usuário</label>
        <div class="tipo-usuario">
          <input type="radio" name="tipo" id="estudante" value="estudante" checked>
          <label for="estudante">Estudante</label>

          <input type="radio" name="tipo" id="educador" value="educador">
          <label for="educador">Educador</label>
        </div>

        <button type="submit" class="btn-primario">Cadastrar</button>

        <p id="mensagemCadastro" class="mensagem-auth"></p>
      </form>

      <p class="link-auth">
        Já possui uma conta? <a href="login.html">Fazer Login</a>
      </p>
    </section>
  </main>

  <footer class="rodape">
    <p>® 2026 Conrad Virtual School. Todos os direitos reservados.</p>
    <p><a href="contato.html">Entre em contato</a></p>
  </footer>

  <script src="../JS/auth.js"></script>
</body>
</html>
