<!DOCTYPE html>
<!--
  ============================================================================
  Arquivo   : pages/cadastro.html
  Finalidade: Tela de cadastro de conta.
  Público   : Visitantes.
  Conteúdo  : Formulário #formCadastro (nome, e-mail, senha e tipo de conta aluno/educador). Tratado por JS/auth.js (POST /cadastro).
  Relações  : CSS: variaveis, geral, componentes | JS: tema.js, auth.js
  Observação: este HTML contém apenas estrutura e conteúdo; estilos ficam em CSS/ e
              comportamentos em JS/ (sem <style>, style="", scripts inline ou onclick).
  ============================================================================
-->
<html lang="pt-br">
<!-- CABEÇALHO DO DOCUMENTO: metadados, título, tema, fontes e folhas de estilo -->
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONRAD Virtual School - Cadastro</title>
  <!-- Tema (normal/claro/escuro): carregado no <head>, sem defer, para aplicar o tema antes da primeira pintura -->
  <script src="../JS/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../CSS/variaveis.css">
  <link rel="stylesheet" href="../CSS/geral.css">
  <link rel="stylesheet" href="../CSS/componentes.css">
  <link rel="icon" type="image/png" href="../img/emblema-64.png">
  <link rel="apple-touch-icon" href="../img/emblema-180.png">
</head>
<body class="css-auth">
<!-- ============================================================================================================================ -->
  <header class="topo">
            <a href="../index.html" class="logo">CONRAD</a>
              <nav class="menu">
                  <a href="../index.html">Início</a>
                  <a href="sobre.html">Sobre</a>
                  <a href="contato.html">Contato</a>
              </nav>
  </header>
<!-- ============================================================================================================================ -->
  <main class="container pagina-auth">
    <section class="bloco-auth">
      <h1>Cadastro</h1>
      <p class="texto-auth">Crie sua conta para acessar a plataforma</p>

      <!-- FORMULÁRIO #formCadastro: campos e botão de envio (o envio é tratado por JavaScript externo, sem onsubmit no HTML) -->
      <form class="form-auth" id="formCadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <label for="confirmasenha">Confirma senha</label>
        <input type="password" id="confirmasenha" placeholder="Digite sua senha novamente" required>

<!-- ============================================================================================================================ -->
        <label>Tipo de usuário</label>
        <div class="tipo-usuario">
          <input type="radio" name="tipo" id="estudante" value="aluno" checked>
          <label for="estudante">Estudante</label>

          <input type="radio" name="tipo" id="educador" value="educador">
          <label for="educador">Educador</label>
        </div>

        <button type="submit" class="btn-primario">Cadastrar</button>

        <p id="mensagemCadastro" class="mensagem-auth"></p>
      </form>

      <p class="link-auth">
        Já possui uma conta? <a href="login.html">Fazer Login</a>
      </p>
    </section>
  </main>
<!-- ============================================================================================================================ -->
  <footer class="rodape">
    <p>® 2026 Conrad Virtual School. Todos os direitos reservados.</p>
    <p><a href="contato.html">Entre em contato</a></p>
  </footer>

  <!-- SCRIPTS: config.js define CONRAD_API/conradFetch; os demais (defer) rodam após o HTML ser lido; layout.js é sempre o último -->
  <script defer src="../JS/auth.js"></script>
</body>
</html>
