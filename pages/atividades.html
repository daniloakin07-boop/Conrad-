<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividades | Conrad Virtual School</title>
  <script src="../JS/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../CSS/variaveis.css">
  <link rel="stylesheet" href="../CSS/geral.css">
  <link rel="stylesheet" href="../CSS/componentes.css">
  <link rel="stylesheet" href="../CSS/atividades.css">
  <link rel="icon" type="image/png" href="../img/emblema-64.png">
  <link rel="apple-touch-icon" href="../img/emblema-180.png">
</head>
<body class="css-redirect-atividades">
  <!-- Página antiga, substituída por aluno-atividades.html (aluno) e professor-correcao.html (educador).
       Este arquivo só existe para os links e favoritos antigos continuarem funcionando. -->
  <main class="conteudo-redirecionamento">
    <p>Levando você para a página de atividades…</p>
    <p><a href="aluno-atividades.html">Sou aluno</a> · <a href="professor-correcao.html">Sou educador</a></p>
  </main>
  <script src="../JS/config.js"></script>
  <script>
    (async function () {
      let destino = 'login.html';
      try {
        const eu = await conradFetch('/me');
        destino = eu.usuario.tipo === 'educador' ? 'professor-correcao.html' : 'aluno-atividades.html';
      } catch (erro) {
        // sem sessão (ou sem servidor): o login resolve
      }
      location.replace(destino);
    })();
  </script>
  <script src="../JS/layout.js" defer></script>
</body>
</html>
