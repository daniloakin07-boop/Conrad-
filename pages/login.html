<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/auth.css">
  <title>CONRAD Virtual School - Login</title>
</head>
<body>

  <header class="topo">
    <a href="index.html" class="logo">CONRAD</a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="container pagina-auth">
    <section class="bloco-auth">
      <h1>Login</h1>
      <p class="texto-auth">Bem vindo de volta! Acesse sua conta.</p>

      <form class="form-auth" id="formLogin">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <div class="form-row">
          <label><input type="checkbox" id="lembrar"> Lembre-me</label>
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-primario">Entrar</button>

        <p id="mensagemLogin" class="mensagem-auth"></p>
      </form>

      <p class="link-auth">
        Ainda não possui uma conta? <a href="cadastro.html">Criar conta</a>
      </p>
    </section>
  </main>

  <footer class="rodape">
    <p>® 2026 Conrad Virtual School. Todos os direitos reservados.</p>
    <p><a href="contato.html">Entre em contato</a></p>
  </footer>

  <script src="../JS/auth.js"></script>
</body>
</html>
