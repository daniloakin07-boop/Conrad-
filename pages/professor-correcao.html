<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conrad | Entregas e correções</title>
  <link rel="stylesheet" href="../CSS/geral.css" />
  <link rel="stylesheet" href="../CSS/atividades.css" />
  <link rel="stylesheet" href="../CSS/usuarios.css">
  <link rel="stylesheet" href="../CSS/turmas.css">
  <link rel="icon" type="image/png" href="../img/Emblema.png">
</head>
<!-- ============================================================================================================================ -->

<body class="css-correcao css-painel">
  <header class="topo">
    <a href="../index.html" class="logo">CONRAD</a>
    <nav class="menu">
      <a href="../index.html">Inicio</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="acoes-topo">
      <span class="user-link" id="nome-usuario">👤</span>
      <a href="#" class="logout-link" id="sair">Sair</a>
    </div>
  </header>
  <!-- ============================================================================================================================ -->
  <main class="container layout-correcao">

    <!-- MENU LATERAL PADRONIZADO -->
    <aside class="menu-lateral" data-menu="auto">

      <!-- O JavaScript atualiza o título -->
      <h3>Conrad</h3>

      <!-- O layout.js cria os links automaticamente -->
      <nav aria-label="Menu principal"></nav>

      <!-- Área de suporte -->
      <div class="menu-ajuda">
        <strong>Precisa de ajuda?</strong>
        <p>Acesse o suporte da plataforma.</p>
        <a href="contato.html" class="btn-secundario">
          Suporte
        </a>
      </div>

      <!-- Informações do usuário -->
      <div class="menu-perfil">
        <strong>Minha conta</strong>
        <span>Usuário</span>
      </div>

    </aside>
    <div class="pagina">
      <div class="cabecalho">
        <div>
          <h1 id="titulo-conteudo">Entregas e correções</h1>
          <p class="subtitulo" id="subtitulo-conteudo">Veja o que cada turma entregou, dê a nota e escreva o feedback.
          </p>
        </div>
        <div class="botoes" id="botoes-topo"></div>
      </div>

      <div class="card" id="filtros">
        <div class="corrigir" style="grid-template-columns: 1fr 1fr; align-items: end;">
          <label>Turma
            <select id="filtro-turma"
              style="width:100%;padding:10px 12px;border:1px solid #d8dce1;border-radius:8px;font:inherit;">
              <option value="">Todas as turmas</option>
            </select>
          </label>
          <label>Tipo
            <select id="filtro-tipo"
              style="width:100%;padding:10px 12px;border:1px solid #d8dce1;border-radius:8px;font:inherit;">
              <option value="">Atividades e avaliações</option>
              <option value="atividade">Só atividades</option>
              <option value="avaliacao">Só avaliações</option>
            </select>
          </label>
        </div>
      </div>
      <div id="lista">
        <p class="vazio">Carregando...</p>
      </div>
    </div>

  </main>
  <!-- ============================================================================================================================ -->
  <footer class="rodape">
    <p>© 2026 Conrad Virtual School. Todos os direitos reservados.</p>
  </footer>
  <!-- ============================================================================================================================ -->
  <script src="../JS/config.js"></script>
  <script src="../JS/professor-correcao.js"></script>
  <script src="../JS/layout.js" defer></script>
</body>

</html>
