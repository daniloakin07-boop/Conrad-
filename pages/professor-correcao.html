<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conrad | Correção de atividades</title>
  <link rel="stylesheet" href="../CSS/geral.css" />
  <link rel="stylesheet" href="../CSS/atividades.css" />
  <link rel="icon" type="image/png" href="../img/Emblema.png">
<!-- =================================================================================================================== -->
</head>
<body class="css-correcao">
  <header class="topo">
    <a href="../index.html" class="logo">CONRAD</a>
    <nav class="menu">
      <a href="educador.html">Painel</a>
      <a href="professor-correcao.html" class="ativo">Atividades</a>
      <a href="salas.html">Turmas</a>
    </nav>
    <div class="acoes-topo">
      <span class="user-link" id="nome-usuario">👤</span>
      <a href="#" class="logout-link" id="sair">Sair</a>
    </div>
  </header>
<!-- =================================================================================================================== -->
  <main class="container">
    <div class="pagina">
      <div class="cabecalho">
        <div>
          <h1>Atividades e correção</h1>
          <p class="subtitulo">Publique atividades e provas, receba as entregas dos alunos e dê nota e feedback.</p>
        </div>
        <div class="botoes">
          <a href="nova-atividade.html" class="btn">+ Nova atividade</a>
          <a href="nova-avaliacao.html" class="btn-sec">+ Nova avaliação</a>
        </div>
      </div>

      <div id="lista"></div>
    </div>
  </main>
<!-- =================================================================================================================== -->
  <footer class="rodape">
    <p>© 2026 Conrad Virtual School. Todos os direitos reservados.</p>
  </footer>

  <script src="../JS/config.js"></script>
  <!-- =================================================================================================================== -->
  <script>
    const $ = (seletor) => document.querySelector(seletor);

    // Cria um elemento com texto seguro (textContent evita injeção de HTML)
    function h(tag, classe, texto) {
      const el = document.createElement(tag);
      if (classe) el.className = classe;
      if (texto != null) el.textContent = texto;
      return el;
    }

    function dataBR(iso) {
      if (!iso) return 'sem prazo';
      const [a, m, d] = iso.split('-');
      return d + '/' + m + '/' + a;
    }

    function criarEntrega(entrega, valorMaximo, atualizarContagem) {
      const caixa = h('div', 'entrega');

      const topo = h('div', 'entrega-topo');
      topo.append(
        h('strong', null, entrega.aluno),
        h('span', null, 'Enviada em ' + new Date(entrega.enviada_em).toLocaleString('pt-BR'))
      );

      const campoNota = h('input');
      campoNota.type = 'number';
      campoNota.min = '0';
      campoNota.max = String(Number(valorMaximo));
      campoNota.step = '0.1';
      campoNota.placeholder = 'Nota / ' + Number(valorMaximo);
      if (entrega.nota != null) campoNota.value = Number(entrega.nota);

      const campoFeedback = h('textarea');
      campoFeedback.placeholder = 'Feedback para o aluno (opcional)';
      campoFeedback.value = entrega.feedback || '';

      const corrigir = h('div', 'corrigir');
      corrigir.append(campoNota, campoFeedback);

      const botao = h('button', 'btn', entrega.corrigida_em ? 'Atualizar correção' : 'Salvar correção');
      botao.type = 'button';
      const msg = h('span', 'msg');

      botao.addEventListener('click', async () => {
        botao.disabled = true;
        try {
          await conradFetch('/api/entregas/' + entrega.id + '/correcao', {
            method: 'PUT',
            body: JSON.stringify({ nota: campoNota.value, feedback: campoFeedback.value })
          });
          msg.className = 'msg ok';
          msg.textContent = 'Correção salva!';
          botao.textContent = 'Atualizar correção';
          atualizarContagem();
        } catch (erro) {
          msg.className = 'msg erro';
          msg.textContent = erro.message;
        } finally {
          botao.disabled = false;
        }
      });

      const acoes = h('div', 'acoes');
      acoes.append(botao, msg);

      caixa.append(topo, h('div', 'resposta', entrega.resposta), corrigir, acoes);
      return caixa;
    }

    function criarCard(a) {
      const card = h('article', 'card');

      const contagem = h('span', 'contagem');
      const mostrarContagem = () => {
        contagem.textContent = a.total_entregas + ' entrega(s) • ' + a.corrigidas + ' corrigida(s)';
      };
      mostrarContagem();

      const topo = h('div', 'card-topo');
      topo.append(h('span', 'tag ' + a.tipo, a.tipo === 'avaliacao' ? 'Avaliação' : 'Atividade'), contagem);

      const botao = h('button', 'btn-sec', 'Ver entregas');
      botao.type = 'button';
      const painel = h('div', 'entregas');
      painel.hidden = true;
      let carregado = false;

      botao.addEventListener('click', async () => {
        painel.hidden = !painel.hidden;
        botao.textContent = painel.hidden ? 'Ver entregas' : 'Ocultar entregas';
        if (painel.hidden || carregado) return;

        try {
          const dados = await conradFetch('/api/atividades/' + a.id + '/entregas');
          painel.replaceChildren();
          if (dados.entregas.length === 0) {
            painel.append(h('p', 'vazio', 'Nenhum aluno entregou ainda.'));
          }
          dados.entregas.forEach((e) => {
            painel.append(criarEntrega(e, dados.valor_maximo, recarregarContagem));
          });
          carregado = true;
        } catch (erro) {
          painel.replaceChildren(h('p', 'msg erro', erro.message));
        }
      });

      // Atualiza o contador de corrigidas buscando a lista de novo
      async function recarregarContagem() {
        const lista = await conradFetch('/api/atividades');
        const atual = lista.find((x) => x.id === a.id);
        if (atual) {
          a.total_entregas = atual.total_entregas;
          a.corrigidas = atual.corrigidas;
          mostrarContagem();
        }
      }

      const rodape = h('div', 'acoes');
      rodape.append(botao);

      card.append(
        topo,
        h('h3', null, a.titulo),
        h('p', 'meta', a.disciplina + ' • ' + a.turma + ' • Prazo: ' + dataBR(a.data_aplicacao) +
          ' • Valor: ' + Number(a.valor_maximo) + ' pts'),
        rodape,
        painel
      );
      return card;
    }

    async function carregar() {
      const atividades = await conradFetch('/api/atividades');
      const lista = $('#lista');
      lista.replaceChildren();
      atividades.forEach((a) => lista.append(criarCard(a)));
      if (atividades.length === 0) {
        lista.append(h('p', 'vazio', 'Você ainda não publicou nenhuma atividade. Use os botões acima para começar.'));
      }
    }

    $('#sair').addEventListener('click', (evento) => {
      evento.preventDefault();
      conradFetch('/logout', { method: 'POST' }).finally(() => { location.href = '../index.html'; });
    });

    function mostrarErro(erro) {
      $('#lista').replaceChildren(h('p', 'msg erro', 'Não foi possível carregar: ' + erro.message));
    }

    (async function iniciar() {
      try {
        const eu = await conradFetch('/me');
        if (eu.usuario.tipo !== 'educador') {
          location.href = 'aluno-atividades.html';
          return;
        }
        $('#nome-usuario').textContent = '👤 ' + eu.usuario.nome;
        await carregar();
      } catch (erro) {
        if (erro.status === 401) location.href = 'login.html';
        else mostrarErro(erro);
      }
    })();
  </script>
</body>
</html>
